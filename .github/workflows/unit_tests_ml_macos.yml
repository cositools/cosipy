name: unit_tests_ml_macos

on: [push, pull_request]

jobs:
  tests:

    defaults:
      run:
        shell: bash -el {0}

    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      # Ideally we would like to install everything
      # automatically with pip. However, there's a conflict
      # between the OpenMP libraries shipped with healpy and
      # pytorch. See https://github.com/pytorch/pytorch/issues/44282
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: cosipy-env
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
      - name: Install dependencies OpenMP
        run: |
          conda install -c conda-forge healpy pytorch
      - name: Verify Python environment
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os
          import sys

          print(sys.version)
          print(f"Python executable: {sys.executable}")
          assert sys.version_info[:2] == tuple(map(int, os.environ["EXPECTED_PYTHON_VERSION"].split(".")))
          assert os.path.realpath(sys.prefix) == os.path.realpath(os.environ["CONDA_PREFIX"])
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ml]"
      - name: Tests
        run: |
          python -m pip install pytest pytest-cov
          python -m pytest tests --junitxml=junit/test-results.xml --cov=cosipy --cov-report=xml --cov-report=html
      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          