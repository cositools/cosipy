threeml_source_models:
  template (point source): &template_spectrum

    position:

      l:

        value: 0.0

        desc: Galactic longitude

        min_value: 0.0

        max_value: 360.0

        unit: deg

        is_normalization: false

        delta: 0.1

        free: false

      b:

        value: 0.0

        desc: Galactic latitude

        min_value: -90.0

        max_value: 90.0

        unit: deg

        is_normalization: false

        delta: 0.1

        free: false

      equinox: J2000

    spectrum:

      main:

        Powerlaw:

          K:

            value: 0.1

            desc: Normalization (differential flux at the pivot value)

            min_value: 1.0e-30

            max_value: 1000.0

            unit: keV-1 s-1 cm-2

            is_normalization: true

            delta: 0.1

            free: true

          piv:

            value: 100.0

            desc: Pivot value

            min_value: null

            max_value: null

            unit: keV

            is_normalization: false

            delta: 0.1

            free: false

          index:

            value: -2.2

            desc: Photon index

            min_value: -10.0

            max_value: 10.0

            unit: ''

            is_normalization: false

            delta: 0.20099999999999998

            free: true

        polarization: { }




tsdetect:
  model: # This is a list of sources that will be read by astromodels.core.model_parser.ModelParser
